version = "0.0"

env {
  vars {
    SHELLOPTS = "errexit:nounset:pipefail"
  }
}

nodes {
  "build:docs" {
    description = "Build the documentation."
    tasks = [
      { script = "cargo doc --no-deps --document-private-items" }
    ]
  }

  "build:program" {
    description = "Build debug and release."
    env { vars { SHELLOPTS = "errexit:pipefail" } }
    matrix {
      parallel = false
      dimensions = [
        [
          { env { vars { CARGO_FLAGS = ""          } } },
          { env { vars { CARGO_FLAGS = "--release" } } }
        ]
      ]
    }
    tasks = [
      { script = "cargo build $CARGO_FLAGS" }
    ]
  }

  "test:program" {
    description = "Run the test suite."
    tasks = [
      { script = "cargo test --no-fail-fast" }
    ]
  }

  "dependencies:upgrade" {
    description = "Upgrade all workspace dependencies."
    tasks = [
      { script = "cargo upgrade -i --pinned" }
    ]
  }

  "format" {
    description = "Format the entire workspace (nightly)."
    tasks = [
      { script = "cargo +nightly fmt" }
    ]
  }

  "hook:pre-push" {
    description = "Git pre-push hook — builds and tests."
    pre = [
      { regex = "^build:" },
      { name  = "test:program" }
    ]
    tasks = []
  }

  "release:init" {
    description = "Initialize the release folder."
    pre = [
      { regex = "^build:" },
      { name  = "test:program" }
    ]
    tasks = [
      {
        script = """
          rm -rf ./.release || true
          mkdir ./.release
          mkdir ./.release/temp
          mkdir ./.release/assets
        """
      }
    ]
  }

  "release:asset:generate:compile" {
    description = "Cross-compile release binaries."
    pre = [ { name = "release:init" } ]
    matrix {
      parallel = true
      dimensions = [
        [
          { env { vars { TARGET = "x86_64-unknown-linux-gnu"  } } },
          { env { vars { TARGET = "x86_64-unknown-linux-musl" } } },
          { env { vars { TARGET = "aarch64-unknown-linux-gnu" } } },
          { env { vars { TARGET = "aarch64-apple-darwin"      } } }
        ]
      ]
    }
    tasks = [
      {
        script = """
          rustup target add --toolchain stable ${TARGET}
          cross build --release --target ${TARGET}
          cp ./target/${TARGET}/release/neomake ./.release/assets/neomake-${TARGET}
        """
      }
    ]
  }

  "release:asset:generate:manpages" {
    description = "Generate manpages."
    pre = [ { name = "release:init" } ]
    tasks = [
      {
        script = """
          cargo run -- man -o ./.release/temp/manpages -f manpages
          cd ./.release/temp/manpages
          tar -czf ../../assets/docs-manpages.tar.gz .
        """
      }
    ]
  }

  "release:asset:generate:markdown" {
    description = "Generate markdown docs."
    pre = [ { name = "release:init" } ]
    tasks = [
      {
        script = """
          cargo run -- man -o ./.release/temp/markdown -f markdown
          cd ./.release/temp/markdown
          tar -czf ../../assets/docs-markdown.tar.gz .
        """
      }
    ]
  }

  "release:asset:generate:shellcompletion" {
    description = "Generate shell completion scripts."
    pre = [ { name = "release:init" } ]
    matrix {
      parallel = true
      dimensions = [
        [
          { env { vars { LANGUAGE = "bash"       } } },
          { env { vars { LANGUAGE = "zsh"        } } },
          { env { vars { LANGUAGE = "fish"       } } },
          { env { vars { LANGUAGE = "elvish"     } } },
          { env { vars { LANGUAGE = "powershell" } } }
        ]
      ]
    }
    tasks = [
      {
        script = """
          mkdir -p "./.release/temp/shellcompletion"
          cargo run -- autocomplete -o ./.release/temp/shellcompletion/${LANGUAGE} -s ${LANGUAGE}
          cd ./.release/temp/shellcompletion/${LANGUAGE}
          tar -czf ../../../assets/shell-completion-${LANGUAGE}.tar.gz .
        """
      }
    ]
  }

  "release:asset:sign" {
    description = "GPG-sign all release assets."
    pre = [ { regex = "^release:asset:generate:" } ]
    tasks = [
      {
        script = """
          for file in ./.release/assets/*; do
            echo "Signing: ${file}"
            gpg --default-key="{{ signer }}" --armor --detach-sig --output ./.release/assets/$(basename -- ${file}).sig ${file}
            echo ""
          done
        """
      }
    ]
  }

  "release:asset:verify" {
    description = "Verify all signatures."
    pre = [ { name = "release:asset:sign" } ]
    tasks = [
      {
        script = """
          for sig in ./.release/assets/*.sig; do
            echo "Verifying: ${sig%.sig} with signature ${sig}"
            gpg --verify "$sig" "${sig%.sig}"
            echo ""
          done
        """
      }
    ]
  }

  "release:github" {
    description = "Publish a GitHub release."
    pre = [ { name = "release:asset:verify" } ]
    tasks = [
      {
        script = """
          echo "=== === ==="
          echo "Releasing neomake version: {{ version }}"
          echo "--- --- ---"
        """
      },
      {
        script = """
          if ! [ -z "$(git status --porcelain)" ]; then
            echo "Dirty repo. Commit all changes before releasing."
            exit 1
          fi
        """
      },
      {
        script = """
          if ! gh auth status >/dev/null 2>&1; then
            echo "You need to login: gh auth login"
            exit 1
          fi
        """
      },
      {
        script = "gh release create {{ version }} --latest --target=master --title=\"Release {{ version }}\" ./.release/assets/*"
      }
    ]
  }

  "release:cratesio" {
    description = "Publish to crates.io."
    pre = [ { regex = "^build:" } ]
    tasks = [
      {
        script = """
          cargo publish --dry-run -p neomake
          cp Cargo.toml Cargo.toml.bak
          sed 's/version = "0.0.0"/version = "{{ version }}"/g' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
          cargo publish --allow-dirty -p neomake
          mv Cargo.toml.bak Cargo.toml
        """
      }
    ]
  }
}
