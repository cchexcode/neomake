version = "0.0"

env {
  capture = "^(CAPTURE)$"
  vars {
    DEFAULT_ENV_VAR    = "default var"
    OVERRIDE_ENV_VAR_0 = "old e0"
    OVERRIDE_ENV_VAR_1 = "old e1"
  }
}

# Optional workflow-wide container encapsulation. Tasks run inside this image unless a
# node / matrix cell / task overrides — or sets `disabled = true` to fall back to host.
# Uncomment to enable:
#
# container {
#   image    = "alpine:latest"
#   workdir  = "/work"                      # container workdir + bind-mount target
#   user     = "host"                       # host | root | "UID:GID"
#   mount    = true                         # bind host CWD at workdir
#   # Runtime selection is an enum carrying that runtime's extras. Pick one.
#   runtime {
#     docker { extra_args = [ "--network=host" ] }
#   }
#   # Or for podman:
#   # runtime {
#   #   podman { extra_args = [ "--userns=keep-id" ] }
#   # }
# }

nodes {
  python {
    description = "Example of using multiple execution environments (shell and python)."
    shell       = "/bin/bash -c"
    matrix {
      parallel = false
      dimensions = [
        [
          { env { vars { PRINT_VAL = "value 0" } } },
          { env { vars { PRINT_VAL = "value 1" } } }
        ]
      ]
    }
    tasks = [
      { shell = "python3 -c", script = "print('yada')" },
      { script = "printf \"$PRINT_VAL\"" },
      { script = "printf \"test anchor\"" }
    ]
  }

  a {
    matrix {
      parallel = true
      dimensions = [
        [
          { env { vars { VA = "A0" } } },
          { env { vars { VA = "A1" } } }
        ],
        [
          { env { vars { VB = "B0" } } },
          { env { vars { VB = "B1" } } },
          { env { vars { VB = "B2" } } }
        ],
        [
          { env { vars { VC = "C0" } } },
          { env { vars { VC = "C1" } } }
        ]
      ]
    }
    tasks = [
      { script = "echo \"$VA $VB $VC\"" }
    ]
  }

  b {
    pre = [ { name = "a" } ]
    tasks = [
      { script = "echo \"b\"" }
    ]
  }

  c {
    matrix {
      parallel = true
      dimensions = [
        [
          { env { vars { VA = "A0" } } },
          { env { vars { VA = "A1" } } }
        ],
        [
          { env { vars { VB = "B0" } } },
          { env { vars { VB = "B1" } } }
        ]
      ]
    }
    pre = [ { name = "b" } ]
    tasks = [
      { script = """
          echo "$VA $VB"
        """
      }
    ]
  }

  minimal {
    tasks = [
      { script = "echo \"minimal\"" }
    ]
  }

  error {
    tasks = [
      { script = "exit 1" }
    ]
  }

  graph {
    pre = [
      { name = "minimal" },
      { name = "a" },
      { name = "b" }
    ]
    tasks = []
  }

  test {
    matrix {
      parallel = false
      dimensions = [
        [ { env { vars { OVERRIDE_ENV_VAR_0 = "new e0" } } } ]
      ]
    }
    tasks = [
      {
        env { vars { OVERRIDE_ENV_VAR_1 = "new e1" } }
        script = """
          set -e
          echo "$DEFAULT_ENV_VAR"
          echo "$OVERRIDE_ENV_VAR_0"
          echo "$OVERRIDE_ENV_VAR_1"
          echo "{{ args.test }}"
        """
      }
    ]
  }
}
